<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>通知与免打扰管理</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>通知与免打扰管理</h1>
    <div id="support-banner" class="banner hidden"></div>
  </header>

  <main>
    <section class="panel">
      <h2>通知权限</h2>
      <div class="row">
        <button id="btn-permission">申请通知权限</button>
        <span id="permission-status" class="tag">未查询</span>
        <span id="dnd-now" class="tag">免打扰：未生效</span>
      </div>
      <div id="permission-hint" class="message hidden"></div>
    </section>

    <section class="panel">
      <h2>发送通知</h2>
      <div class="row">
        <input id="notif-title" type="text" placeholder="标题" />
      </div>
      <div class="row">
        <input id="notif-body" type="text" placeholder="正文" />
      </div>
      <div class="row">
        <input id="notif-icon" type="text" placeholder="图标 URL（可选）" />
      </div>
      <div class="row">
        <button id="btn-send">发送通知</button>
      </div>
      <div id="send-message" class="message hidden"></div>
    </section>

    <section class="panel">
      <h2>免打扰时段</h2>
      <div class="row">
        <input id="dnd-start" type="time" value="22:00" />
        <span>至</span>
        <input id="dnd-end" type="time" value="07:00" />
        <button id="btn-add-dnd">添加时段</button>
      </div>
      <ul id="dnd-list" class="dnd-list"></ul>
      <div class="muted">支持跨天时段（如 22:00 - 07:00）。按本地时间判断，时区变化后自动适配。</div>
    </section>

    <section class="panel">
      <h2>免打扰可视化</h2>
      <canvas id="dnd-canvas" width="640" height="120"></canvas>
    </section>

    <section class="panel">
      <h2>通知历史</h2>
      <div class="row">
        <button id="btn-clear-history" class="secondary">清空历史</button>
      </div>
      <ul id="history-list" class="history-list"></ul>
    </section>
  </main>

  <div id="toast-container"></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
