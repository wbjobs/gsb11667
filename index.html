<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>多窗口布局管理器</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>多窗口布局管理器</h1>
    <div id="support-banner" class="banner hidden"></div>
  </header>

  <main>
    <section class="panel">
      <h2>权限与屏幕</h2>
      <div class="row">
        <button id="btn-permission">申请 Window Management 权限</button>
        <span id="permission-status" class="tag">未查询</span>
      </div>
      <div id="screens-list" class="screens-list"></div>
    </section>

    <section class="panel">
      <h2>窗口</h2>
      <div class="row">
        <button id="btn-open-window">打开新窗口</button>
        <span id="window-count" class="tag">0 个子窗口</span>
      </div>
      <ul id="windows-list" class="windows-list"></ul>
    </section>

    <section class="panel">
      <h2>布局</h2>
      <div class="row">
        <select id="layout-type">
          <option value="grid">网格布局</option>
          <option value="waterfall">瀑布布局</option>
          <option value="primary-secondary">主次布局</option>
        </select>
        <select id="target-screen"></select>
        <button id="btn-apply">应用布局</button>
      </div>
      <div class="row">
        <input id="layout-name" type="text" placeholder="布局名称" />
        <button id="btn-save">保存布局</button>
        <select id="saved-layouts"></select>
        <button id="btn-restore">恢复布局</button>
        <button id="btn-delete">删除</button>
      </div>
      <div id="layout-message" class="message hidden"></div>
    </section>

    <section class="panel">
      <h2>布局预览</h2>
      <canvas id="preview" width="640" height="400"></canvas>
    </section>
  </main>

  <script type="module" src="js/main.js"></script>
</body>
</html>
